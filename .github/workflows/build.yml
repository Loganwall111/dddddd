name: Build

# Compiles the mod on every push and on demand. This is the project's real compile check: the
# development sandbox has no JDK, so the only honest way to know the sources build is to let
# Gradle and javac do it here, against the same Loom/Fabric/Yarn versions the mod targets.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (Java 21, MC 1.21.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beyond-the-limits

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace --warning-mode all

      - name: Summarise the jar
        if: always()
        run: ls -la build/libs || true

      - name: Upload the mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-limits-jar
          path: beyond-the-limits/build/libs/*.jar
          if-no-files-found: warn
