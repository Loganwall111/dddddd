name: Build

# Compiles the mod on every push and on demand. The development sandbox has no JDK, so Gradle and
# javac here are the project's real compile check, against the same Loom/Fabric/Yarn versions the
# mod targets. The full build output is always uploaded as an artifact so failures can be read
# without trawling the web UI.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (Java 21, MC 1.21.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beyond-the-limits

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --console=plain --warning-mode all 2>&1 | tee build-output.txt

      - name: Extract the errors
        if: failure()
        run: |
          {
            echo "### javac / Gradle errors"
            echo '```'
            grep -nE "error:|FAILED|Execution failed|What went wrong|Caused by|Could not|Unresolved" build-output.txt | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            beyond-the-limits/build-output.txt
            beyond-the-limits/build/reports/**
          if-no-files-found: warn

      - name: Upload the mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-limits-jar
          path: beyond-the-limits/build/libs/*.jar
          if-no-files-found: warn
