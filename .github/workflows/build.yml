name: Build

# Compiles the mod on every push and on demand. This is the project's real compile check: Gradle and
# javac run against the same Loom/Fabric/Yarn versions the mod targets.
#
# The build output is published to the `ci-logs` branch on every run, pass or fail, so compile errors
# can be read from a checkout instead of the web UI. Pushes to `ci-logs` are deliberately excluded
# from the triggers below, so publishing a log can never start another build.
on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Java 21, MC 1.21.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beyond-the-limits

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_imports.py 2>&1 | tee build-output.txt
          python3 tools/check_lang.py 2>&1 | tee -a build-output.txt
          python3 tools/check_mod_invariants.py 2>&1 | tee -a build-output.txt

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Build
        # pipefail matters: without it, the exit status of the pipeline is `tee`'s, and a failing
        # Gradle run would be reported as a successful build.
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --console=plain --warning-mode all 2>&1 | tee build-output.txt

      - name: Smoke-test dimension registries on a headless server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/registry-smoke build
          printf 'eula=true\n' > run/registry-smoke/eula.txt
          printf 'online-mode=false\nserver-port=0\n' > run/registry-smoke/server.properties
          input_pipe=run/registry-smoke/server.stdin
          server_log=build/registry-smoke.log
          rm -f "$input_pipe"
          mkfifo "$input_pipe"
          timeout 180s ./gradlew runServer --no-daemon --console=plain --args=--nogui < "$input_pipe" > "$server_log" 2>&1 &
          server_pid=$!
          exec 3>"$input_pipe"
          ready=false
          for attempt in $(seq 1 90); do
            if grep -Fq 'Done (' "$server_log"; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log" | tee -a build-output.txt
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat "$server_log" | tee -a build-output.txt
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi
          printf 'stop\n' >&3
          exec 3>&-
          wait "$server_pid"
          tail -80 "$server_log" | tee -a build-output.txt

      - name: Extract the errors
        if: failure()
        run: |
          {
            echo "### javac / Gradle errors"
            echo '```'
            grep -nEi "error:|failed|Execution failed|What went wrong|Caused by|Could not|Unresolved|missing lang|unimported vanilla|invariant failed" build-output.txt | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-limits-jar
          path: beyond-the-limits/build/libs/*.jar
          if-no-files-found: warn

      - name: Publish the build output to the ci-logs branch
        if: always()
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout --orphan ci-logs-tmp
          git reset
          mkdir -p ci-logs
          cp beyond-the-limits/build-output.txt ci-logs/latest.txt
          cp beyond-the-limits/build-output.txt "ci-logs/run-${GITHUB_RUN_NUMBER}.txt"
          git add -f ci-logs
          git commit -m "CI: build output for run ${GITHUB_RUN_NUMBER} [skip ci]"
          git push -f origin ci-logs-tmp:ci-logs
