name: Beyond the Threshold — build & validate
on:
  push:
    paths: ['beyond-threshold/**', '.github/workflows/beyond-build.yml']
  pull_request:
    paths: ['beyond-threshold/**', '.github/workflows/beyond-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beyond-threshold
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Offline integrity checks (json, registrations, assets)
        run: python3 tools/validate.py
      - name: Compile-check every GLSL program (glslang)
        run: |
          curl -sSL -o /tmp/glslang.tgz https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz
          mkdir -p /tmp/glslang && tar xzf /tmp/glslang.tgz -C /tmp/glslang
          python3 tools/check_shaders.py "$(find /tmp/glslang -name glslangValidator -type f | head -1)"
      - name: Compile mod and report diagnostics
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon build 2>&1 | tee "$RUNNER_TEMP/beyond-build.log"; then
            python3 - <<'PYLOG'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'beyond-build.log'
          text = '\n'.join(log.read_text().splitlines()[-100:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Fabric build diagnostics::' + text)
          PYLOG
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Beyond-the-Threshold-0.1.0-alpha
          path: |
            beyond-threshold/build/libs/*.jar
