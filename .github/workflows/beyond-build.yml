name: Beyond Minecraft — build & smoke test
on:
  push:
    paths: ['beyond-minecraft/**', '.github/workflows/beyond-build.yml']
  pull_request:
    paths: ['beyond-minecraft/**', '.github/workflows/beyond-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beyond-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: beyond-minecraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native shader and software-GL test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools xvfb xauth libgl1-mesa-dri libopenal1
      - name: Verify generated resources and resource contracts
        run: |
          python3 tools/generate_multiverse.py --check
          python3 tools/validate.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          python3 tools/check_shaders.py
      - name: Compile both environments and run JUnit tests
        run: ./gradlew --no-daemon --console=plain build
      - name: Load real Minecraft registries and generate every realm
        shell: bash
        run: |
          mkdir -p run
          # Isolated automated test server only. No production server or public port.
          echo 'eula=true' > run/eula.txt
          printf 'online-mode=false\nserver-ip=127.0.0.1\nlevel-seed=84921603\nview-distance=2\nsimulation-distance=2\nmax-tick-time=120000\n' > run/server.properties
          set +e
          BEYOND_SMOKE=1 timeout 480 ./gradlew --no-daemon --console=plain runServer --args=nogui 2>&1 | tee server-smoke.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" = 0
          grep -q 'BEYOND_SERVER_SMOKE_PASS' server-smoke.log
          ! grep -q 'BEYOND_SERVER_SMOKE_FAIL' server-smoke.log
      - name: Compile shaders in the actual Minecraft client (Mesa / Xvfb)
        shell: bash
        run: |
          set +e
          BEYOND_CLIENT_SMOKE=1 LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null timeout 480 xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew --no-daemon --console=plain runClient 2>&1 | tee client-smoke.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" = 0
          grep -q 'BEYOND_CLIENT_SHADER_SMOKE_PASS' client-smoke.log
          ! grep -q 'BEYOND_CLIENT_SHADER_SMOKE_FAIL' client-smoke.log
      - name: Upload installable alpha (only after all checks pass)
        uses: actions/upload-artifact@v4
        with:
          name: Beyond-Minecraft-1.21.1-alpha
          path: |
            beyond-minecraft/build/libs/*.jar
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beyond-verification
          path: |
            beyond-minecraft/build/reports/tests/
            beyond-minecraft/*-smoke.log
            beyond-minecraft/run/logs/latest.log
            beyond-minecraft/run/crash-reports/
