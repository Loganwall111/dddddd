name: Sift Overhaul — build & validate
on:
  push:
    paths: ['fabric-mod/**', '.github/workflows/sift-build.yml']
  pull_request:
    paths: ['fabric-mod/**', '.github/workflows/sift-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-mod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Encode audio (wav -> ogg vorbis)
        run: |
          command -v oggenc || (sudo apt-get update -qq && sudo apt-get install -y -qq vorbis-tools)
          S=src/main/resources/assets/entersift/sounds
          mkdir -p $S/ritual
          oggenc -Q -q 5 -o $S/ritual/song.ogg art/audio/ritual_song.wav
          find art/audio -mindepth 2 -name '*.wav' | while read -r f; do
            rel=${f#art/audio/}; out=$S/${rel%.wav}.ogg
            mkdir -p "$(dirname "$out")"
            oggenc -Q -q 4 -o "$out" "$f"
          done
          test -s $S/ritual/song.ogg
          test -s $S/music/sift_1.ogg
          python3 - <<'PY'
          import json, pathlib
          s = pathlib.Path('src/main/resources/assets/entersift')
          miss = []
          for ev in json.loads((s / 'sounds.json').read_text()).values():
              for e in ev['sounds']:
                  n = e if isinstance(e, str) else e['name']
                  if not (s / 'sounds' / (n.split(':')[1] + '.ogg')).exists(): miss.append(n)
          print('missing sounds:', miss); assert not miss
          PY
      - run: python3 tools/validate.py
      - run: python3 tools/test_data.py
      - name: Regeneration baseline (live generators reproduce the shipped tree)
        run: python3 tools/regen_check.py
      - name: Compile-check shaderpack and core shaders (glslang)
        run: |
          curl -sSL --fail -o /tmp/glslang.tgz https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz
          mkdir -p /tmp/glslang && tar xzf /tmp/glslang.tgz -C /tmp/glslang
          TOOL=$(find /tmp/glslang -name glslangValidator -type f | head -1)
          # 0.34: this used to pass an empty string when the find came up empty, and check_shaders.py
          # then skipped every compile while still exiting 0 - which is how a stray #endif shipped and
          # crashed the client. A missing compiler is now a build failure.
          test -x "$TOOL" || { echo "::error title=glslang missing::extracted tarball did not contain glslangValidator"; exit 1; }
          "$TOOL" --version | head -2
          python3 tools/check_shaders.py "$TOOL"
      - name: Compile mod and report diagnostics
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon build 2>&1 | tee "$RUNNER_TEMP/sift-build.log"; then
            python3 - <<'PYLOG'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'sift-build.log'
          text = '\n'.join(log.read_text().splitlines()[-100:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Fabric build diagnostics::' + text)
          PYLOG
            exit 1
          fi
      - name: Verify the built-in shader pack is inside the jar
        shell: bash
        run: |
          jar=$(ls build/libs/*.jar | grep -v sources | head -1)
          pack=$(grep -o 'Dungeons-II-Overworld-[0-9.]*\.zip' src/client/java/dev/logan/entersift/SiftClient.java | head -1)
          echo "jar=$jar pack=$pack"
          unzip -l "$jar" | grep "assets/entersift/shaderpacks/$pack" || { echo "::error title=Shader pack missing::$pack is not in $jar"; exit 1; }
          unzip -p "$jar" "assets/entersift/shaderpacks/$pack" > "$RUNNER_TEMP/pack.zip"
          unzip -l "$RUNNER_TEMP/pack.zip" | grep -E "shaders/(shaders.properties|composite|gbuffers_terrain)" | head -5
          echo "::notice title=Shader pack bundled::$pack ($(stat -c %s "$RUNNER_TEMP/pack.zip") bytes) is inside $(basename "$jar")"
      - uses: actions/upload-artifact@v4
        with:
          name: Sift-Overhaul-0.35.0-alpha-26.3
          path: |
            fabric-mod/build/libs/*.jar
      - name: Server smoke test (real 26.3 server loads data pack, worldgen, creatures)
        shell: bash
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          printf 'online-mode=false\nlevel-seed=20260927\nspawn-protection=0\nsync-chunk-writes=false\n' > run/server.properties
          SIFT_SMOKE=1 timeout 1200 ./gradlew --no-daemon runServer --args=nogui 2>&1 | tee "$RUNNER_TEMP/server.log" || true
          python3 tools/smoke_report.py "$RUNNER_TEMP/server.log"

