name: Enter the Sift — build & validate
on:
  push:
    paths: ['fabric-mod/**', '.github/workflows/sift-build.yml']
  pull_request:
    paths: ['fabric-mod/**', '.github/workflows/sift-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-mod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Encode audio (wav -> ogg vorbis)
        run: |
          command -v oggenc || (sudo apt-get update -qq && sudo apt-get install -y -qq vorbis-tools)
          S=src/main/resources/assets/entersift/sounds
          mkdir -p $S/ritual
          oggenc -Q -q 5 -o $S/ritual/song.ogg art/audio/ritual_song.wav
          find art/audio -mindepth 2 -name '*.wav' | while read -r f; do
            rel=${f#art/audio/}; out=$S/${rel%.wav}.ogg
            mkdir -p "$(dirname "$out")"
            oggenc -Q -q 4 -o "$out" "$f"
          done
          test -s $S/ritual/song.ogg
          test -s $S/music/sift_1.ogg
          python3 - <<'PY'
          import json, pathlib
          s = pathlib.Path('src/main/resources/assets/entersift')
          miss = []
          for ev in json.loads((s / 'sounds.json').read_text()).values():
              for e in ev['sounds']:
                  n = e if isinstance(e, str) else e['name']
                  if not (s / 'sounds' / (n.split(':')[1] + '.ogg')).exists(): miss.append(n)
          print('missing sounds:', miss); assert not miss
          PY
      - run: python3 tools/validate.py
      - run: python3 tools/test_data.py
      - name: Compile-check shaderpack (glslang)
        run: |
          curl -sSL -o /tmp/glslang.tgz https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz
          mkdir -p /tmp/glslang && tar xzf /tmp/glslang.tgz -C /tmp/glslang
          python3 tools/check_shaders.py "$(find /tmp/glslang -name glslangValidator -type f | head -1)"
      - name: Compile mod and report diagnostics
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon build 2>&1 | tee "$RUNNER_TEMP/sift-build.log"; then
            python3 - <<'PYLOG'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'sift-build.log'
          text = '\n'.join(log.read_text().splitlines()[-100:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Fabric build diagnostics::' + text)
          PYLOG
            exit 1
          fi
      - name: Verify the built-in shader pack is inside the jar
        shell: bash
        run: |
          jar=$(ls build/libs/*.jar | grep -v sources | head -1)
          pack=$(grep -o 'Dungeons-II-Overworld-[0-9.]*\.zip' src/client/java/dev/logan/entersift/SiftClient.java | head -1)
          echo "jar=$jar pack=$pack"
          unzip -l "$jar" | grep "assets/entersift/shaderpacks/$pack" || { echo "::error title=Shader pack missing::$pack is not in $jar"; exit 1; }
          unzip -p "$jar" "assets/entersift/shaderpacks/$pack" > "$RUNNER_TEMP/pack.zip"
          unzip -l "$RUNNER_TEMP/pack.zip" | grep -E "shaders/(shaders.properties|composite|gbuffers_terrain)" | head -5
          echo "::notice title=Shader pack bundled::$pack ($(stat -c %s "$RUNNER_TEMP/pack.zip") bytes) is inside $(basename "$jar")"
      - uses: actions/upload-artifact@v4
        with:
          name: Enter-the-Sift-26.3-alpha
          path: |
            fabric-mod/build/libs/*.jar
      - name: Server smoke test (real 26.3 server loads data pack, worldgen, creatures)
        shell: bash
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          printf 'online-mode=false\nlevel-seed=20260927\nspawn-protection=0\nsync-chunk-writes=false\n' > run/server.properties
          SIFT_SMOKE=1 timeout 1200 ./gradlew --no-daemon runServer --args=nogui 2>&1 | tee "$RUNNER_TEMP/server.log" || true
          python3 tools/smoke_report.py "$RUNNER_TEMP/server.log"
      - name: Headless visual test (real Minecraft client framebuffer)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libvulkan1 mesa-vulkan-drivers
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe glxinfo -B
          lvp_icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -type f -print -quit)
          if [[ -n "$lvp_icd" ]]; then export VK_ICD_FILENAMES="$lvp_icd"; fi
          mkdir -p run/screenshots
          sed -i '/^pause-when-empty-seconds=/d' run/server.properties
          printf '\npause-when-empty-seconds=0\n' >> run/server.properties
          rm -f run/screenshots/*.png "$RUNNER_TEMP/sift-visual-overworld.done" "$RUNNER_TEMP/sift-visual-night.done"
          export SIFT_VISUAL_PHASE1_SIGNAL="$RUNNER_TEMP/sift-visual-overworld.done"
          export SIFT_VISUAL_PHASE2_SIGNAL="$RUNNER_TEMP/sift-visual-night.done"
          server_log="$RUNNER_TEMP/sift-visual-server.log"
          client_log="$RUNNER_TEMP/sift-visual-client.log"
          diagnostic_error() {
            python3 - "$server_log" "$client_log" <<'PYLOG'
          import re, sys
          from pathlib import Path
          parts = []
          for raw in sys.argv[1:]:
              path = Path(raw)
              if not path.is_file():
                  continue
              lines = path.read_text(errors='replace').splitlines()
              parts.append(f'--- {path.name}: relevant startup/capture lines ---')
              matches = [line for line in lines if re.search(r'SIFT-VISUAL|Quick.?Play|connect|multiplayer|OpenGL|Vulkan|backend|ERROR|WARN|Server empty|pausing', line, re.I)]
              parts.extend(matches[-24:])
              parts.append(f'--- {path.name}: final lines ---')
              parts.extend(lines[-10:])
          text = "\n".join(parts).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print('::error title=Headless visual test diagnostic tail::' + text)
          PYLOG
          }
          SIFT_VISUAL_TEST=1 ./gradlew --no-daemon runServer --args=nogui > "$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -TERM "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 180); do
            if grep -q '\[SIFT-VISUAL\] FAIL' "$server_log" 2>/dev/null; then
              tail -100 "$server_log"
              exit 1
            fi
            if grep -q 'Done (' "$server_log" 2>/dev/null && grep -q '\[SIFT-VISUAL\] scene ready:' "$server_log" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -100 "$server_log"
              echo 'Visual-test server exited before it was ready.'
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            tail -120 "$server_log"
            echo 'Timed out waiting for the deterministic Rift scene.'
            exit 1
          fi
          set +e
          SIFT_VISUAL_CAPTURE=1 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe ALSOFT_DRIVERS=null timeout 240s \
            xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' \
            ./gradlew --no-daemon --project-cache-dir "$RUNNER_TEMP/sift-visual-client-project" runClient \
              --args='--quickPlayMultiplayer 127.0.0.1:25565 --username SiftVisualTest --width 1280 --height 720' \
              > "$client_log" 2>&1
          client_status=$?
          set -e
          echo '--- visual client log (tail) ---'
          tail -120 "$client_log"
          echo '--- visual server log (tail) ---'
          tail -80 "$server_log"
          if [[ "$client_status" != 0 ]]; then
            echo "Headless Minecraft client exited with status $client_status."
            diagnostic_error
            exit "$client_status"
          fi
          if grep -q '\[SIFT-VISUAL\] FAIL' "$client_log" "$server_log"; then
            echo 'The in-game visual capture reported a failure.'
            diagnostic_error
            exit 1
          fi
          for capture in rift-front rift-close-up rift-side rift-night-cubes sift-sky-and-rift; do
            if ! grep -q "capturing $capture" "$client_log"; then
              echo "Missing expected Minecraft framebuffer capture: $capture"
              diagnostic_error
              exit 1
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          folder = Path('run/screenshots')
          images = sorted(folder.glob('*.png'), key=lambda p: p.stat().st_mtime_ns)
          if len(images) < 5:
              raise SystemExit(f'Expected five actual Minecraft framebuffer PNGs; found {len(images)} in {folder}')
          names = ['rift-front.png', 'rift-close-up.png', 'rift-side.png', 'rift-night-cubes.png', 'sift-sky-and-rift.png']
          for source, name in zip(images, names):
              target = folder / name
              if source != target:
                  source.replace(target)
          print('Captured and labelled Minecraft framebuffer images:')
          for name in names:
              image = folder / name
              print(f'  {image}: {image.stat().st_size} bytes')
              if image.stat().st_size < 4096:
                  raise SystemExit(f'Screenshot is unexpectedly small: {image}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sift-headless-client-screenshots
          path: |
            fabric-mod/run/screenshots/*.png
            ${{ runner.temp }}/sift-visual-server.log
            ${{ runner.temp }}/sift-visual-client.log
          if-no-files-found: warn

