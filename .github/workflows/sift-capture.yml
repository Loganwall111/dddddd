name: Enter the Sift — headless visual capture (Xvfb + llvmpipe)
on:
  push:
    paths:
      - 'fabric-mod/src/client/**'
      - 'fabric-mod/src/main/resources/assets/entersift/shaders/**'
      - 'fabric-mod/tools/ci_capture.py'
      - '.github/workflows/sift-capture.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-mod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Virtual display + software GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libgles2 mesa-vulkan-drivers mesa-utils vulkan-tools
          Xvfb :99 -screen 0 1280x720x24 +extension GLX > /tmp/xvfb.log 2>&1 &
          sleep 3
          {
            echo "== glxinfo =="; DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe glxinfo -B 2>&1 | head -14
            echo "== eglinfo =="; DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 eglinfo -B 2>&1 | head -10
            echo "== vulkaninfo =="; DISPLAY=:99 vulkaninfo --summary 2>&1 | grep -E "deviceName|apiVersion|ERROR" | head -6
            ls /usr/share/vulkan/icd.d/ 2>&1
          } > /tmp/gldiag.log 2>&1
          cat /tmp/gldiag.log
      - name: Boot server + capture client, run the capture sequence
        run: |
          export ENTERSIFT_CAPTURE_DIR=$PWD/../capture-out
          export DISPLAY=:99 GALLIUM_DRIVER=llvmpipe LIBGL_ALWAYS_SOFTWARE=1
          # 26.3's renderpearl uses SDL3: GLX visual selection fails on Xvfb; EGL on X11 works with llvmpipe.
          export SDL_VIDEO_X11_FORCE_EGL=1 SDL_VIDEODRIVER=x11
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          mkdir -p "$ENTERSIFT_CAPTURE_DIR" run docs/captures
          echo 'eula=true' > run/eula.txt
          printf 'tutorialStep:none\nonboarded:true\n' > run/options.txt
          printf 'online-mode=false\nwhite-list=false\nenforce-whitelist=false\nlevel-type=minecraft:flat\nenable-rcon=true\nrcon.password=capture\nrcon.port=25575\nspawn-protection=0\nview-distance=6\nsimulation-distance=6\npause-when-empty-seconds=-1\n' > run/server.properties
          ./gradlew --no-daemon runServer --args=nogui > /tmp/server.log 2>&1 &
          python3 -u tools/ci_capture.py "$ENTERSIFT_CAPTURE_DIR" 25575 2>&1 | tee /tmp/capture.log
          rc=${PIPESTATUS[0]}
          pkill -f GradleWrapperMain || true; pkill -f net.minecraft || true
          cp "$ENTERSIFT_CAPTURE_DIR"/rift_first_person.png docs/captures/rift_first_person.png || rc=1
          cp "$ENTERSIFT_CAPTURE_DIR"/rift_side_angle.png docs/captures/rift_side_angle.png || rc=1
          cp "$ENTERSIFT_CAPTURE_DIR"/rift_close_up.png docs/captures/rift_close_up.png || rc=1
          cp "$ENTERSIFT_CAPTURE_DIR"/rift_night_front.png docs/captures/rift_night_front.png || rc=1
          cp "$ENTERSIFT_CAPTURE_DIR"/rift_summon_ring.png docs/captures/rift_summon_ring.png || rc=1
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rift-captures
          path: |
            fabric-mod/docs/captures/*.png
            /tmp/client.log
            /tmp/server.log
      - name: Publish failure logs into the branch (sandbox cannot download artifacts)
        if: failure()
        run: |
          mkdir -p docs/captures
          { echo "== orchestrator =="; tail -120 /tmp/capture.log 2>/dev/null; echo "== gl diag =="; cat /tmp/gldiag.log 2>/dev/null; echo "== client =="; tail -250 /tmp/client.log 2>/dev/null; echo "== server =="; tail -60 /tmp/server.log 2>/dev/null; } > docs/captures/last_failure.log
          git config user.name "sift-probe"
          git config user.email "sift-probe@users.noreply.github.com"
          git add -f docs/captures/last_failure.log
          git commit -m "Capture failure logs [skip ci]" || echo nothing
          git pull --rebase || true
          git push || echo nothing
      - name: Commit captures back to the branch (so they land in the dev sandbox)
        if: success()
        run: |
          git config user.name "sift-probe"
          git config user.email "sift-probe@users.noreply.github.com"
          git add docs/captures || true
          git commit -m "Headless rift captures [skip ci]" || echo "nothing to commit"
          git pull --rebase || true
          git push || echo "nothing to push"
