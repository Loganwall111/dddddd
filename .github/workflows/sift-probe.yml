name: Enter the Sift — API probe
on:
  push:
    paths: ['fabric-mod/tools/probe/**', '.github/workflows/sift-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-mod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: bash tools/probe/probe.sh
      - name: Commit probe output back to the branch (artifact downloads are unavailable in the dev sandbox)
        run: |
          mkdir -p ../probe-output && cp build/probe/* ../probe-output/
          cd .. && git config user.name "sift-probe" && git config user.email "sift-probe@users.noreply.github.com"
          git add probe-output && git commit -m "Probe output [skip ci]" && git pull --rebase && git push || echo "nothing to push"
